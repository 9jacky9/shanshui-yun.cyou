<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="100%" height="100%">
  <defs>
    <linearGradient id="alpineBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1720"/>
      <stop offset="55%" stop-color="#132533"/>
      <stop offset="100%" stop-color="#0E1D28"/>
    </linearGradient>
    <linearGradient id="contourTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E7490" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0E7490" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="sweepBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Cartography Slate Canvas -->
  <rect width="680" height="460" fill="url(#alpineBg)"/>

  <!-- Coordinate Grid Lines -->
  <g stroke="#1E3648" stroke-width="1" opacity="0.65">
    <line x1="0" y1="80" x2="680" y2="80"/>
    <line x1="0" y1="160" x2="680" y2="160"/>
    <line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="320" x2="680" y2="320"/>
    <line x1="0" y1="400" x2="680" y2="400"/>
    <line x1="110" y1="0" x2="110" y2="460"/>
    <line x1="230" y1="0" x2="230" y2="460"/>
    <line x1="350" y1="0" x2="350" y2="460"/>
    <line x1="470" y1="0" x2="470" y2="460"/>
    <line x1="590" y1="0" x2="590" y2="460"/>
  </g>

  <!-- Topographic Mountain Elevation Contours (Left & Center Alpine Ridge) -->
  <g fill="none" stroke="url(#contourTeal)" stroke-width="1.4">
    <path d="M 40 380 C 120 260, 220 240, 340 290 C 450 335, 550 220, 640 270"/>
    <path d="M 60 350 C 145 220, 235 200, 345 255 C 445 300, 540 185, 630 235"/>
    <path d="M 85 320 C 165 185, 250 165, 350 220 C 440 268, 525 150, 615 200"/>
    <path d="M 115 290 C 185 155, 265 135, 355 188 C 435 230, 510 120, 595 168"/>
    <path d="M 150 255 C 210 130, 280 115, 360 158 C 425 195, 495 98, 570 140"/>
  </g>

  <!-- Concentric Topographic Peak Rings (Center-Left Peak: 35.6895N) -->
  <g fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1.2">
    <ellipse cx="230" cy="195" rx="95" ry="52"/>
    <ellipse cx="230" cy="195" rx="68" ry="36"/>
    <ellipse cx="230" cy="195" rx="42" ry="22"/>
    <circle cx="230" cy="195" r="10">
      <animate attributeName="r" values="8;24;8" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.8;0.1;0.8" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Concentric Topographic Peak Rings (Right Peak: 47.3769N) -->
  <g fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1.2">
    <ellipse cx="515" cy="155" rx="88" ry="48"/>
    <ellipse cx="515" cy="155" rx="58" ry="30"/>
    <ellipse cx="515" cy="155" rx="32" ry="16"/>
    <circle cx="515" cy="155" r="9">
      <animate attributeName="r" values="7;22;7" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.85;0.12;0.85" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Radar Compass Ring & Rotating Sweep at Hub Station (350, 240) -->
  <g transform="translate(350, 240)">
    <circle cx="0" cy="0" r="118" fill="none" stroke="#0E7490" stroke-width="1.2" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.4"/>
    <g>
      <path d="M 0 0 L 118 0 A 118 118 0 0 1 83.4 83.4 Z" fill="url(#sweepBeam)"/>
      <line x1="0" y1="0" x2="118" y2="0" stroke="#EA580C" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Geodesic Relay Routes (Paths for Data Packets) -->
  <path id="routeWestToCore" d="M 95 335 Q 210 140 350 240" fill="none" stroke="#EA580C" stroke-width="2.2" stroke-dasharray="5 5"/>
  <path id="routeCoreToNorth" d="M 350 240 Q 430 130 515 155" fill="none" stroke="#22D3EE" stroke-width="2.2"/>
  <path id="routeCoreToEast" d="M 350 240 Q 480 295 595 285" fill="none" stroke="#EA580C" stroke-width="2" stroke-dasharray="6 4"/>
  <path id="routeWestToNorth" d="M 230 195 Q 375 85 515 155" fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-dasharray="4 4"/>

  <!-- Animated Relay Data Packets Gliding Along Routes -->
  <circle r="5.5" fill="#EA580C" filter="url(#glowOrange)">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M 95 335 Q 210 140 350 240"/>
  </circle>
  <circle r="5" fill="#22D3EE" filter="url(#glowOrange)">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M 350 240 Q 430 130 515 155"/>
  </circle>
  <circle r="5.5" fill="#EA580C" filter="url(#glowOrange)">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 350 240 Q 480 295 595 285"/>
  </circle>
  <circle r="4.5" fill="#FDE047">
    <animateMotion dur="3.1s" repeatCount="indefinite" path="M 230 195 Q 375 85 515 155"/>
  </circle>

  <!-- Relay Station Nodes & Alpine Peak Markers -->
  <!-- Station 1: Base Camp West -->
  <g transform="translate(95, 335)">
    <circle cx="0" cy="0" r="7" fill="#EA580C"/>
    <circle cx="0" cy="0" r="13" fill="none" stroke="#EA580C" stroke-width="1.5">
      <animate attributeName="r" values="7;18;7" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="4" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11" font-weight="bold">HKG-BGP [ALT 820m]</text>
  </g>

  <!-- Station 2: Ridge Relay -->
  <g transform="translate(230, 195)">
    <polygon points="0,-9 8,7 -8,7" fill="#22D3EE"/>
    <text x="-65" y="-14" fill="#38BDF8" font-family="Consolas, monospace" font-size="11" font-weight="bold">TYO-IEPL [2,450m]</text>
  </g>

  <!-- Station 3: Central Core Summit -->
  <g transform="translate(350, 240)">
    <circle cx="0" cy="0" r="9" fill="#EA580C" stroke="#FFFFFF" stroke-width="2"/>
    <text x="-58" y="26" fill="#FFFFFF" font-family="Consolas, monospace" font-size="12" font-weight="bold">SHANSHUI-CORE [4,800m]</text>
  </g>

  <!-- Station 4: Alpine North Summit -->
  <g transform="translate(515, 155)">
    <polygon points="0,-10 9,8 -9,8" fill="#EA580C"/>
    <text x="-48" y="-16" fill="#FDBA74" font-family="Consolas, monospace" font-size="11" font-weight="bold">FRA-CORE [3,690m]</text>
  </g>

  <!-- Station 5: Pacific Relay East -->
  <g transform="translate(595, 285)">
    <circle cx="0" cy="0" r="7" fill="#22D3EE"/>
    <text x="-85" y="22" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11" font-weight="bold">SJC-CN2 [1,920m]</text>
  </g>

  <!-- Telemetry HUD Overlay Boxes -->
  <g transform="translate(20, 20)">
    <rect width="215" height="58" rx="4" fill="#09131C" fill-opacity="0.85" stroke="#0E7490" stroke-width="1.2"/>
    <text x="12" y="22" fill="#22D3EE" font-family="Consolas, monospace" font-size="11" font-weight="bold">TOPO-RELAY TELEMETRY</text>
    <text x="12" y="42" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">LAT: 27.9881°N | LOSS: 0.00%</text>
  </g>

  <g transform="translate(455, 385)">
    <rect width="205" height="52" rx="4" fill="#09131C" fill-opacity="0.85" stroke="#EA580C" stroke-width="1.2"/>
    <text x="12" y="21" fill="#FDBA74" font-family="Consolas, monospace" font-size="11" font-weight="bold">BGP GEODESIC LINK: ACTIVE</text>
    <text x="12" y="39" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11">THROUGHPUT: 10.4 Gbps</text>
  </g>
</svg>
