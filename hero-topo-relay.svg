<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep slate to mountain twilight -->
    <linearGradient id="shanshuiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09141D"/>
      <stop offset="50%" stop-color="#102534"/>
      <stop offset="100%" stop-color="#0D1E2A"/>
    </linearGradient>

    <!-- Mountain Layer 1 (Far peaks, misty cyan) -->
    <linearGradient id="peakFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E4D68" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#102534" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Mountain Layer 2 (Mid peaks, rich teal) -->
    <linearGradient id="peakMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E7490" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0A3C4D" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Mountain Layer 3 (Fore peaks, deep teal slate) -->
    <linearGradient id="peakFore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#164E63" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08222E" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Flowing Water Gradient (River streams) -->
    <linearGradient id="waterFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0E7490" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Cloud Mist Gradient -->
    <linearGradient id="mistGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0"/>
      <stop offset="35%" stop-color="#BAE6FD" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#7DD3FC" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="680" height="460" fill="url(#shanshuiBg)"/>

  <!-- Celestial Coordinate Grid / Fine Cartography Grid -->
  <g stroke="#1E384D" stroke-width="1" opacity="0.35">
    <line x1="0" y1="90" x2="680" y2="90"/>
    <line x1="0" y1="180" x2="680" y2="180"/>
    <line x1="0" y1="270" x2="680" y2="270"/>
    <line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="135" y1="0" x2="135" y2="460"/>
    <line x1="270" y1="0" x2="270" y2="460"/>
    <line x1="405" y1="0" x2="405" y2="460"/>
    <line x1="540" y1="0" x2="540" y2="460"/>
  </g>

  <!-- Far Mountain Silhouette (Layer 1) -->
  <path d="M 0 320 Q 110 160 210 220 T 430 180 T 680 260 L 680 460 L 0 460 Z" fill="url(#peakFar)"/>

  <!-- Cloud Mist Belt 1 (Between far and mid peaks) -->
  <ellipse cx="260" cy="240" rx="280" ry="22" fill="url(#mistGrad)">
    <animate attributeName="cx" values="240;290;240" dur="14s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Mid Mountain Silhouette (Layer 2) with Distinct Mountain Peaks -->
  <path d="M 0 380 Q 90 220 180 250 Q 270 140 370 210 Q 470 110 570 200 Q 640 180 680 320 L 680 460 L 0 460 Z" fill="url(#peakMid)"/>

  <!-- Cloud Mist Belt 2 (Drifting Across Mid Ridge) -->
  <ellipse cx="440" cy="270" rx="260" ry="28" fill="url(#mistGrad)">
    <animate attributeName="cx" values="460;410;460" dur="18s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Fore Mountain Ridge (Layer 3) -->
  <path d="M 0 420 Q 80 290 160 330 Q 250 240 340 310 Q 450 260 550 340 Q 620 310 680 410 L 680 460 L 0 460 Z" fill="url(#peakFore)"/>

  <!-- Mountain Contour Ripple Lines (等高线纹理) -->
  <g fill="none" stroke="#22D3EE" stroke-width="1.2" opacity="0.45">
    <path d="M 200 240 Q 270 170 370 220 Q 470 145 560 220"/>
    <path d="M 220 255 Q 280 190 370 235 Q 460 165 550 235"/>
    <path d="M 120 310 Q 210 235 310 285 Q 420 225 510 300"/>
    <path d="M 140 325 Q 220 255 310 300 Q 410 245 490 315"/>
  </g>

  <!-- Water Waves / Flowing River Ripples (水纹动态波浪) -->
  <g fill="none" stroke="url(#waterFlow)" stroke-linecap="round">
    <!-- River Channel 1 -->
    <path id="waterStream1" d="M -40 405 C 120 375, 240 445, 420 400 C 530 370, 620 425, 720 395" stroke-width="2.6"/>
    <!-- River Channel 2 -->
    <path id="waterStream2" d="M -20 425 C 140 395, 270 460, 450 418 C 550 392, 630 440, 720 415" stroke-width="2.2" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="0;-112" dur="6s" repeatCount="indefinite"/>
    </path>
    <!-- River Channel 3 (Foreground deep wave) -->
    <path id="waterStream3" d="M 0 445 C 160 420, 300 475, 480 435 C 570 415, 640 455, 700 438" stroke-width="2.8" stroke-dasharray="14 8">
      <animate attributeName="stroke-dashoffset" values="0;-132" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Network Interconnection Backbone Overlay (山水云跨域拓扑) -->
  <g fill="none">
    <path id="coreRouteA" d="M 180 250 Q 275 120 370 210" stroke="#EA580C" stroke-width="2" stroke-dasharray="5 5"/>
    <path id="coreRouteB" d="M 370 210 Q 470 90 570 200" stroke="#22D3EE" stroke-width="2"/>
    <path id="coreRouteC" d="M 180 250 Q 340 330 570 200" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="6 4"/>
  </g>

  <!-- Animated Data Packets (Gliding smoothly between peaks) -->
  <circle r="5" fill="#EA580C" filter="url(#nodeGlow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M 180 250 Q 275 120 370 210"/>
  </circle>
  <circle r="4.5" fill="#22D3EE" filter="url(#nodeGlow)">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M 370 210 Q 470 90 570 200"/>
  </circle>
  <circle r="4.5" fill="#FDE047">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 180 250 Q 340 330 570 200"/>
  </circle>

  <!-- Mountain Peak Markers -->
  <!-- Station 1 (West Peak) -->
  <g transform="translate(180, 250)">
    <circle cx="0" cy="0" r="7" fill="#0E7490" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#22D3EE" stroke-width="1.2">
      <animate attributeName="r" values="7;18;7" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="-30" y="-14" fill="#BAE6FD" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">西峰山峦</text>
  </g>

  <!-- Station 2 (Center Summit) -->
  <g transform="translate(370, 210)">
    <circle cx="0" cy="0" r="9" fill="#EA580C" stroke="#FFFFFF" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#EA580C" stroke-width="1.4">
      <animate attributeName="r" values="9;24;9" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.95;0.1;0.95" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <text x="-35" y="-18" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">山水云品牌意象</text>
  </g>

  <!-- Station 3 (East Peak) -->
  <g transform="translate(570, 200)">
    <circle cx="0" cy="0" r="7" fill="#0E7490" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#22D3EE" stroke-width="1.2">
      <animate attributeName="r" values="7;18;7" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.1;0.85" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="-30" y="-14" fill="#BAE6FD" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">水纹流韵</text>
  </g>

  <!-- Brand Signature Stamp in Top Corner -->
  <g transform="translate(24, 24)">
    <rect width="180" height="52" rx="6" fill="#0A1822" fill-opacity="0.85" stroke="#0E7490" stroke-width="1.2"/>
    <text x="14" y="24" fill="#22D3EE" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="bold">山水云 · 品牌视觉</text>
    <text x="14" y="42" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">SHANSHUI CLOUD GUIDE</text>
  </g>
</svg>
